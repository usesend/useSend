packages:
  - "packages/*"
  - "apps/*"

allowBuilds:
  "@parcel/watcher": true
  "@prisma/client": true
  "@prisma/engines": true
  "@scarf/scarf": false
  esbuild: true
  keytar: true
  msgpackr-extract: true
  prisma: true
  puppeteer: true
  sharp: true
  unrs-resolver: true

# pnpm 10+ reads overrides from the workspace configuration. Keep this in sync
# with package.json for deployment environments that still use pnpm 9.
overrides:
  "linkify-it@<=5.0.0": "5.0.1"
  "pnpm@<11.11.0": "11.11.0"
  # next accepts sharp ^0.34.3 || ^0.35.5; 0.35.5 is the release the
  # October 2026 Next.js image-optimization advisory (GHSA-2464-fhr4-w9xw) names.
  "sharp@>=0.34.0 <0.35.5": "0.35.5"
