packages:
  - "packages/*"
  - "apps/*"

allowBuilds:
  "@parcel/watcher": true
  "@prisma/client": true
  "@prisma/engines": true
  "@scarf/scarf": false
  esbuild: true
  keytar: true
  msgpackr-extract: true
  prisma: true
  puppeteer: true
  sharp: true
  unrs-resolver: true

# pnpm 10+ reads overrides from the workspace configuration. Keep this in sync
# with package.json for deployment environments that still use pnpm 9.
overrides:
  "brace-expansion@>=1.0.0 <1.1.21": "1.1.21"
  "brace-expansion@>=2.0.0 <2.1.7": "2.1.7"
  "browserslist@>=4.0.0 <4.29.3": "4.29.3"
  "js-yaml@>=4.0.0 <4.3.2": "4.3.2"
  "linkify-it@<=5.0.0": "5.0.1"
  "markdown-it@>=14.0.0 <14.3.3": "14.3.3"
  "nanoid@>=3.0.0 <3.3.20": "3.3.20"
  "pnpm@<11.11.0": "11.11.0"
  "postcss@>=8.0.0 <8.5.30": "8.5.30"
  "prosemirror-view@>=1.0.0 <1.42.6": "1.42.6"
  "react-router-dom@>=7.0.0 <7.18.4": "7.18.4"
  "react-router@>=7.0.0 <7.18.4": "7.18.4"
  "sharp@>=0.34.0 <0.35.5": "0.35.5"
  "source-map-js@>=1.0.0 <1.2.2": "1.2.2"
  "vite@>=7.0.0 <7.3.7": "7.3.7"
  "zod@>=4.0.0 <4.6.6": "4.6.6"
