# Railway (app) and Coolify (SMTP server) build with Nixpacks. Its Node comes
# from a nixpkgs snapshot that lags Node security releases (24.10.0 as of Nov
# 2026), so Node isn't taken from Nix: docker/nixpacks/install-node.sh installs
# a pinned official release and pnpm instead, used for both the build and the
# server. It runs in the setup phase so it's in place before any install
# command, including platform overrides (Coolify sets its own).
# Update the version and hashes in that script with each Node security release.
[phases.setup]
nixPkgs = ["openssl"]
cmds = ["bash docker/nixpacks/install-node.sh"]
# Only the script, so code changes don't redownload Node.
onlyIncludeFiles = ["docker/nixpacks/install-node.sh"]

[phases.install]
cmds = ["pnpm i --frozen-lockfile"]
