name: usesend-prod

services:
  postgres:
    image: postgres:16
    container_name: usesend-db-prod
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?err}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?err}
      - POSTGRES_DB=${POSTGRES_DB:?err}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # ports:
    #   - "5432:5432"
    volumes:
      - database:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: usesend-redis-prod
    restart: always
    # ports:
    #   - "6379:6379"
    volumes:
      - cache:/data
    command: ["redis-server", "--maxmemory-policy", "noeviction"]

  rustfs:
    image: rustfs/rustfs:latest
    container_name: usesend-rustfs-prod
    security_opt:
      - no-new-privileges:true
    ports:
      - 127.0.0.1:${RUSTFS_API_PORT:-9002}:9000
      - 127.0.0.1:${RUSTFS_CONSOLE_PORT:-9001}:9001
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?err}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?err}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: error
    volumes:
      - minio:/data
    command: ["/data"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s

  rustfs-init:
    image: amazon/aws-cli:latest
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:?err}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:?err}
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      S3_COMPATIBLE_BUCKET: ${S3_COMPATIBLE_BUCKET:-usesend}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?err}
    depends_on:
      rustfs:
        condition: service_healthy
    command: |
      if ! aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket "$$S3_COMPATIBLE_BUCKET" >/dev/null 2>&1; then
        aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket "$$S3_COMPATIBLE_BUCKET"
      fi

      printf '{"CORSRules":[{"AllowedOrigins":["%s"],"AllowedMethods":["GET","HEAD","PUT"],"AllowedHeaders":["*"],"ExposeHeaders":["ETag"],"MaxAgeSeconds":3600}]}' "$$NEXTAUTH_URL" > /tmp/cors.json

      aws --endpoint-url http://rustfs:9000 s3api put-bucket-cors \
        --bucket "$$S3_COMPATIBLE_BUCKET" \
        --cors-configuration file:///tmp/cors.json

  usesend:
    image: usesend/usesend:latest
    container_name: usesend
    restart: always
    ports:
      - ${PORT:-3000}:${PORT:-3000}
    environment:
      - HOSTNAME=${HOSTNAME:-0.0.0.0}
      - PORT=${PORT:-3000}
      - DATABASE_URL=${DATABASE_URL:?err}
      - NEXTAUTH_URL=${NEXTAUTH_URL:?err}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?err}
      - AWS_ACCESS_KEY=${AWS_ACCESS_KEY:-}
      - AWS_SECRET_KEY=${AWS_SECRET_KEY:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:?err}
      - GITHUB_ID=${GITHUB_ID:?err}
      - GITHUB_SECRET=${GITHUB_SECRET:?err}
      - REDIS_URL=${REDIS_URL:?err}
      - REDIS_KEY_PREFIX=${REDIS_KEY_PREFIX:-}
      - NEXT_PUBLIC_IS_CLOUD=${NEXT_PUBLIC_IS_CLOUD:-false}
      - API_RATE_LIMIT=${API_RATE_LIMIT:-1}
      - SMTP_HOST=${SMTP_HOST:-smtp.usesend.com}
      - SMTP_USER=${SMTP_USER:-usesend}
      - S3_COMPATIBLE_ACCESS_KEY=${RUSTFS_ACCESS_KEY:?err}
      - S3_COMPATIBLE_SECRET_KEY=${RUSTFS_SECRET_KEY:?err}
      - S3_COMPATIBLE_API_URL=${S3_COMPATIBLE_API_URL:?err}
      - S3_COMPATIBLE_PUBLIC_URL=${S3_COMPATIBLE_PUBLIC_URL:?err}
      - S3_COMPATIBLE_BUCKET=${S3_COMPATIBLE_BUCKET:-usesend}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rustfs-init:
        condition: service_completed_successfully

volumes:
  database:
  cache:
  minio:
