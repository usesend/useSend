name: unsend-dev

services:
  postgres:
    image: postgres:16
    container_name: unsend-db-dev
    restart: always
    environment:
      - POSTGRES_USER=usesend
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=usesend
    volumes:
      - database:/var/lib/postgresql/data
    ports:
      - "54320:5432"

  redis:
    image: redis:7
    container_name: unsend-redis-dev
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis:/data
    command: ["redis-server", "--maxmemory-policy", "noeviction"]

  local-sen-sns:
    image: usesend/local-ses-sns:latest
    container_name: local-ses-sns
    restart: always
    ports:
      - "5350:3000"
    environment:
      WEBHOOK_URL: http://host.docker.internal:3000/api/ses_callback
    extra_hosts:
      - "host.docker.internal:host-gateway"

  rustfs:
    image: rustfs/rustfs:latest
    container_name: usesend-rustfs-prod
    security_opt:
      - no-new-privileges:true
    ports:
      - 127.0.0.1:9002:9000
    environment:
      RUSTFS_ACCESS_KEY: username
      RUSTFS_SECRET_KEY: password
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: error
    volumes:
      - minio:/data
    command: ["/data"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s

  rustfs-init:
    image: amazon/aws-cli:latest
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    environment:
      AWS_ACCESS_KEY_ID: username
      AWS_SECRET_ACCESS_KEY: password
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      S3_COMPATIBLE_BUCKET: ${S3_COMPATIBLE_BUCKET:-unsend}
    depends_on:
      rustfs:
        condition: service_healthy
    command: |
      if ! aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket "$$S3_COMPATIBLE_BUCKET" >/dev/null 2>&1; then
        aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket "$$S3_COMPATIBLE_BUCKET"
      fi

      printf '{"CORSRules":[{"AllowedOrigins":["%s"],"AllowedMethods":["GET","HEAD","PUT"],"AllowedHeaders":["*"],"ExposeHeaders":["ETag"],"MaxAgeSeconds":3600}]}' "$$NEXTAUTH_URL" > /tmp/cors.json

      aws --endpoint-url http://rustfs:9000 s3api put-bucket-cors \
        --bucket "$$S3_COMPATIBLE_BUCKET" \
        --cors-configuration file:///tmp/cors.json

volumes:
  database:
  redis:
  minio:
